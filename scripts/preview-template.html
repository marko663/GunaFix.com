<title>Solaris Industrial — Website-Vorschau / Preview</title>

<style>
  /* Single-theme by intent: the brand mark is drawn for a black ground.
     Every colour is painted explicitly so the page holds on any host. */
  :root {
    --ink: #0a1017;
    --surface: #111a24;
    --surface-2: #172433;
    --line: rgba(255, 255, 255, 0.11);
    --line-strong: rgba(120, 170, 210, 0.32);
    --text: #e8edf2;
    --muted: rgba(232, 237, 242, 0.58);
    --faint: rgba(232, 237, 242, 0.36);
    --solar: #f5c518;
    --solar-bright: #ffd12e;
    --solar-dim: rgba(245, 197, 24, 0.14);

    --display: ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --wrap: 1180px;
    --pad: clamp(1rem, 4vw, 2.5rem);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--display);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { text-wrap: balance; margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  p { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--solar); outline-offset: 3px; }

  .wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--pad); }

  /* Hairline seams instead of cards: the page is drawn like a shop drawing. */
  .band { border-bottom: 1px solid var(--line); }
  .seam { display: grid; gap: 1px; background: var(--line); }
  .seam > * { background: var(--ink); }

  .eyebrow { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--solar); margin: 0; }
  .label { font-size: 0.625rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin: 0; }
  .muted { color: var(--muted); }
  .lede { color: var(--muted); font-size: 1.0625rem; line-height: 1.75; max-width: 62ch; }
  .prose { color: var(--muted); line-height: 1.8; max-width: 68ch; }

  /* ---------- Preview chrome ---------- */
  .previewbar { background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 0.75rem; color: var(--faint); }
  .previewbar .wrap { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; align-items: center; padding-block: 0.55rem; }
  .previewbar strong { color: var(--solar); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.6875rem; }

  /* ---------- Header ---------- */
  header.site { position: sticky; top: 0; z-index: 50; background: rgba(10,16,23,0.93); backdrop-filter: blur(10px); }

  /* Utility bar carrying contact details and the language switcher. */
  .utility { background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .utility .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 40px; }
  .utility .contacts { display: flex; align-items: center; gap: 1.4rem; overflow: hidden; }
  .utility a.contact { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.75rem; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .utility a.contact:hover { color: var(--solar); }
  .utility a.contact svg { width: 14px; height: 14px; flex: none; }
  @media (max-width: 560px) { .utility .contacts a.contact + a.contact { display: none; } }

  .langswitch { display: flex; align-items: center; gap: 0.25rem; }
  .langswitch button {
    background: none; border: 0; cursor: pointer; font: inherit;
    padding: 0.25rem 0.4rem; font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase; color: rgba(232,237,242,0.5);
    transition: color 0.15s ease;
  }
  .langswitch button:hover { color: var(--text); }
  .langswitch button[aria-current="true"] { color: var(--solar); }
  .langswitch .sep { width: 1px; height: 12px; background: rgba(255,255,255,0.2); }

  .mainbar { border-bottom: 1px solid var(--line); }
  .mainbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; min-height: 78px; }

  .logo { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; }
  .logo svg { width: 34px; height: 34px; flex: none; }
  .logo .word { display: flex; flex-direction: column; line-height: 1; }
  .logo .word b { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.34em; color: #fff; }
  .logo .word span { margin-top: 5px; font-size: 0.5rem; font-weight: 500; letter-spacing: 0.42em; color: var(--solar); display: flex; align-items: center; gap: 0.4rem; }
  .logo .word span::before, .logo .word span::after { content: ""; width: 8px; height: 1px; background: rgba(245,197,24,0.7); }

  nav.main { display: flex; flex-wrap: wrap; gap: 0.25rem 1.4rem; }
  nav.main a {
    text-decoration: none; color: var(--muted); font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 0.5rem 0;
    border-bottom: 2px solid transparent; transition: color 0.15s ease, border-color 0.15s ease;
  }
  nav.main a:hover { color: var(--text); }
  nav.main a[aria-current="page"] { color: #fff; border-bottom-color: var(--solar); }

  /* Narrow screens: the header row wraps and the nav drops to its own line,
     so navigation stays usable without any script. */
  @media (max-width: 900px) {
    .mainbar .wrap {
      flex-wrap: wrap; gap: 0.6rem 1rem; min-height: 0; padding-block: 0.85rem;
    }
    nav.main { order: 3; width: 100%; gap: 0.4rem 1rem; }
    nav.main a { font-size: 0.7rem; padding: 0.25rem 0; }
    .logo svg { width: 28px; height: 28px; }
    .logo .word b { font-size: 0.8rem; letter-spacing: 0.26em; }
    .btn { height: 40px; padding-inline: 1.1rem; font-size: 0.78rem; }
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    height: 44px; padding: 0 1.6rem; text-decoration: none;
    font-size: 0.85rem; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    background: var(--solar); color: #000; border: 1px solid var(--solar); cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .btn:hover { background: var(--solar-bright); border-color: var(--solar-bright); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line-strong); }
  .btn.ghost:hover { color: var(--solar); border-color: var(--solar); background: transparent; }

  /* ---------- Views ---------- */
  /* Views switch on :target so the file works with scripts disabled.
     #home shows unless a later view is targeted. */
  /* Clear the sticky header when :target jumps to a section. */
  .view { display: none; scroll-margin-top: 130px; }
  .view:target { display: block; animation: fade 0.35s ease both; }
  #home { display: block; }
  #home:has(~ .view:target) { display: none; }
  .view.is-active { display: block; animation: fade 0.35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .pagehead { position: relative; border-bottom: 1px solid var(--line); overflow: hidden; }
  .pagehead::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(58% 55% at 50% 100%, rgba(245,197,24,0.15), transparent 70%),
      linear-gradient(to right, rgba(140,190,230,0.05) 1px, transparent 1px) 0 0 / 56px 56px,
      linear-gradient(to bottom, rgba(140,190,230,0.05) 1px, transparent 1px) 0 0 / 56px 56px;
    pointer-events: none;
  }
  .pagehead .wrap { position: relative; padding-block: clamp(3.5rem, 8vw, 6rem); }
  .pagehead h1 { font-size: clamp(2.1rem, 5.2vw, 3.4rem); line-height: 1.06; max-width: 20ch; margin-top: 0.9rem; }
  .pagehead .lede { margin-top: 1.4rem; }

  /* ---------- Hero ---------- */
  .hero .wrap { position: relative; display: grid; gap: clamp(2.5rem, 5vw, 4rem); padding-block: clamp(3.5rem, 8vw, 7rem); align-items: center; }
  @media (min-width: 940px) { .hero .wrap { grid-template-columns: 1.05fr 1fr; } }
  .hero h1 { font-size: clamp(2.3rem, 5.6vw, 3.9rem); line-height: 1.04; margin-top: 1rem; }
  .checks { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 0.75rem; }
  .checks li { display: flex; gap: 0.75rem; align-items: flex-start; color: var(--muted); font-size: 0.94rem; }
  .checks li::before { content: "✓"; color: var(--solar); font-weight: 700; line-height: 1.5; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2.4rem; }

  .frame { border: 1px solid var(--line); background: var(--surface); padding: clamp(1.2rem, 3vw, 2rem); }
  .frame svg { display: block; width: 100%; height: auto; }

  .iconrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-top: 1px; }
  .iconrow div { background: var(--surface); display: grid; justify-items: center; gap: 0.6rem; padding: 1.2rem 0.5rem; }
  .iconrow svg { height: 54px; width: auto; }

  /* ---------- Stats ---------- */
  .stats { grid-template-columns: repeat(2, 1fr); }
  @media (min-width: 780px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stats > div { padding: 2.4rem 0.75rem; text-align: center; }
  .stats b { display: block; font-size: clamp(1.7rem, 4vw, 2.3rem); color: var(--solar); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stats .label { margin-top: 0.5rem; }

  /* ---------- Sections ---------- */
  section.block { padding-block: clamp(3.5rem, 7vw, 6rem); }
  .headrow { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-end; justify-content: space-between; }
  .headrow h2, section.block > .wrap > h2 { font-size: clamp(1.6rem, 3.6vw, 2.35rem); margin-top: 0.85rem; }
  .headrow .txt { max-width: 60ch; }
  .grid-3 { grid-template-columns: 1fr; margin-top: clamp(2rem, 4vw, 3.5rem); }
  @media (min-width: 680px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } }
  .grid-2 { grid-template-columns: 1fr; margin-top: clamp(2rem, 4vw, 3.5rem); }
  @media (min-width: 780px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } }
  .grid-4 { grid-template-columns: 1fr; margin-top: clamp(2rem, 4vw, 3.5rem); }
  @media (min-width: 680px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1060px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
  .grid-5 { grid-template-columns: 1fr; margin-top: clamp(2rem, 4vw, 3.5rem); }
  @media (min-width: 680px) { .grid-5 { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .grid-5 { grid-template-columns: repeat(5, 1fr); } }

  .cell { padding: clamp(1.5rem, 3vw, 2rem); display: flex; flex-direction: column; gap: 0.8rem; }
  .cell h3 { font-size: 1.05rem; }
  .cell p { color: var(--muted); font-size: 0.92rem; line-height: 1.7; }
  .cell .viz { height: 118px; margin-bottom: 0.4rem; }
  .cell .viz svg { width: 100%; height: 100%; }
  .modelname { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  .step-no { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.2em; color: var(--solar); }

  ul.bullets { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }
  ul.bullets li { display: flex; gap: 0.7rem; align-items: flex-start; color: var(--muted); font-size: 0.92rem; line-height: 1.65; }
  ul.bullets li::before { content: ""; flex: none; width: 4px; height: 4px; background: var(--solar); margin-top: 0.62em; }

  dl.specs { margin: 0; border: 1px solid var(--line); }
  dl.specs > div { display: flex; gap: 1.5rem; justify-content: space-between; padding: 0.85rem 1.2rem; border-top: 1px solid var(--line); }
  dl.specs > div:first-child { border-top: 0; }
  dl.specs dt { margin: 0; font-size: 0.65rem; letter-spacing: 0.11em; text-transform: uppercase; color: var(--faint); }
  dl.specs dd { margin: 0; font-size: 0.88rem; text-align: right; color: rgba(242,244,246,0.82); }

  .tablewrap { overflow-x: auto; margin-top: clamp(2rem, 4vw, 3rem); }
  table { width: 100%; min-width: 640px; border-collapse: collapse; text-align: left; }
  th { padding: 0.9rem 1.2rem 0.9rem 0; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line-strong); font-weight: 500; }
  th.gf { color: var(--solar); }
  td { padding: 0.95rem 1.2rem 0.95rem 0; font-size: 0.9rem; border-bottom: 1px solid var(--line); color: var(--muted); }
  td.gf { color: var(--text); font-weight: 500; }

  .model { display: grid; gap: clamp(1.8rem, 4vw, 3rem); padding: clamp(1.6rem, 3.5vw, 3rem); align-items: start; }
  @media (min-width: 900px) {
    .model { grid-template-columns: 1fr 1.25fr; }
    .model > .frame { position: sticky; top: 130px; }
  }
  .model h3 { font-size: clamp(1.6rem, 3.4vw, 2.1rem); letter-spacing: 0.13em; text-transform: uppercase; }
  .typechips { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.4rem; }
  .typechips span { border: 1px solid var(--line); padding: 0.3rem 0.7rem; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.2rem; border-top: 1px solid var(--line); padding-top: 1.2rem; margin-top: 0.4rem; }
  @media (min-width: 560px) { .metrics { grid-template-columns: repeat(4, 1fr); } }
  .metrics b { display: block; font-size: 1rem; font-variant-numeric: tabular-nums; }

  details.article { padding: clamp(1.5rem, 3vw, 2rem); }
  details.article summary { cursor: pointer; list-style: none; display: grid; gap: 0.7rem; }
  details.article summary::-webkit-details-marker { display: none; }
  details.article summary h3 { font-size: 1.1rem; }
  details.article summary .more { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--solar); font-weight: 600; }
  details.article[open] summary .more { color: var(--faint); }
  details.article .body { margin-top: 1.6rem; padding-top: 1.6rem; border-top: 1px solid var(--line); display: grid; gap: 1.6rem; }
  details.article .body h4 { font-size: 0.95rem; color: var(--text); }
  details.article .body p { color: var(--muted); font-size: 0.92rem; line-height: 1.8; margin-top: 0.6rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .meta .cat { color: var(--solar); }
  .meta .time { color: var(--faint); }

  /* ---------- Contact ---------- */
  .contactgrid { display: grid; gap: clamp(2rem, 4vw, 3.5rem); }
  @media (min-width: 900px) { .contactgrid { grid-template-columns: 1.3fr 1fr; } }
  .field { display: grid; gap: 0.5rem; }
  .field label { font-size: 0.8rem; font-weight: 500; }
  .field input, .field textarea { background: var(--surface-2); border: 1px solid var(--line); color: var(--text); padding: 0.75rem 0.9rem; font: inherit; font-size: 0.9rem; width: 100%; }
  .field input::placeholder, .field textarea::placeholder { color: rgba(242,244,246,0.28); }
  .fieldgrid { display: grid; gap: 1.1rem; }
  @media (min-width: 620px) { .fieldgrid { grid-template-columns: repeat(2, 1fr); } }
  .panel { border: 1px solid var(--line); padding: clamp(1.3rem, 3vw, 1.8rem); }
  .panel + .panel { margin-top: 1.5rem; }

  .faq { border-top: 1px solid var(--line); margin-top: clamp(2rem, 4vw, 3rem); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq summary { cursor: pointer; list-style: none; padding: 1.15rem 2.5rem 1.15rem 0; font-size: 1rem; font-weight: 500; position: relative; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%); color: var(--solar); font-size: 1.2rem; }
  .faq details[open] summary::after { content: "–"; }
  .faq .answer { padding: 0 0 1.5rem; color: var(--muted); font-size: 0.94rem; line-height: 1.8; max-width: 72ch; }

  /* ---------- CTA + footer ---------- */
  .cta { position: relative; border-block: 1px solid var(--line); overflow: hidden; }
  .cta::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 100%, rgba(245,197,24,0.16), transparent 70%); }
  .cta .wrap { position: relative; display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; justify-content: space-between; padding-block: clamp(3rem, 6vw, 4.5rem); }
  .cta h2 { font-size: clamp(1.6rem, 3.6vw, 2.3rem); max-width: 22ch; }

  footer.site { padding-block: clamp(3rem, 6vw, 4.5rem); }
  .footgrid { display: grid; gap: 2.5rem; }
  @media (min-width: 720px) { .footgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1000px) { .footgrid { grid-template-columns: 1.4fr repeat(3, 1fr); } }
  footer.site ul { list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: 0.65rem; font-size: 0.88rem; color: var(--muted); }
  footer.site a { text-decoration: none; }
  footer.site a:hover { color: var(--solar); }
  .certs { display: flex; flex-wrap: wrap; gap: 1.8rem; border-top: 1px solid var(--line); margin-top: 3rem; padding-top: 2rem; font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--faint); }
  .colophon { margin-top: 2rem; font-size: 0.72rem; color: var(--faint); }

  .note { border: 1px solid rgba(245,197,24,0.3); background: var(--solar-dim); padding: 1.1rem 1.3rem; font-size: 0.85rem; line-height: 1.7; color: rgba(242,244,246,0.75); }
</style>

<div class="previewbar">
  <div class="wrap">
    <strong>Vorschau / Preview</strong>
    <span id="preview-note">__STATIC_NOTE__</span>

</div>
