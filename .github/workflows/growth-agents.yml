name: Growth Agents

on:
  schedule:
    # Every 6 hours. GitHub Actions cron is UTC and best-effort (can run a
    # bit late under load) — close enough for "24/7" background growth work.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
  BUSINESS_URL: ${{ vars.BUSINESS_URL }}
  OWNER_NAME: ${{ vars.OWNER_NAME }}
  OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
  SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
  GA4_CLIENT_EMAIL: ${{ secrets.GA4_CLIENT_EMAIL }}
  GA4_PRIVATE_KEY: ${{ secrets.GA4_PRIVATE_KEY }}
  SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
  META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}

jobs:
  lead-finder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/leadFinder.mjs
        working-directory: automation

  outreach:
    needs: lead-finder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/outreach.mjs
        working-directory: automation

  social-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/socialContent.mjs
        working-directory: automation

  search-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/searchTraffic.mjs
        working-directory: automation

  leader:
    needs: [outreach, social-content, search-traffic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/leader.mjs
        working-directory: automation
