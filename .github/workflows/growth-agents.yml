name: Growth Agents

on:
  schedule:
    # Outreach drains the send queue often so emails go out close to
    # real-time instead of batching for hours. GitHub Actions cron is UTC
    # and best-effort (can run a bit late under load).
    - cron: "*/15 * * * *"
    # Lead Finder runs hourly — every Places Text Search call costs real
    # Google Cloud billing, so this is the volume lever, kept off the
    # 15-minute tick to keep that cost predictable.
    - cron: "0 * * * *"
    # Social content, search/traffic digest, and the leader's rollup are not
    # time-critical — every 6 hours is plenty.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BUSINESS_NAME: ${{ vars.BUSINESS_NAME }}
  BUSINESS_URL: ${{ vars.BUSINESS_URL }}
  BUSINESS_PHYSICAL_ADDRESS: ${{ vars.BUSINESS_PHYSICAL_ADDRESS }}
  OWNER_NAME: ${{ vars.OWNER_NAME }}
  OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
  OWNER_TIMEZONE: ${{ vars.OWNER_TIMEZONE }}
  SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
  LEAD_CATEGORIES: ${{ vars.LEAD_CATEGORIES }}
  LEAD_REGIONS: ${{ vars.LEAD_REGIONS }}
  LEADS_PER_RUN: ${{ vars.LEADS_PER_RUN }}
  LEAD_SEARCHES_PER_RUN: ${{ vars.LEAD_SEARCHES_PER_RUN }}
  DAILY_EMAIL_TARGET: ${{ vars.DAILY_EMAIL_TARGET }}
  GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
  GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
  GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
  GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
  GA4_CLIENT_EMAIL: ${{ secrets.GA4_CLIENT_EMAIL }}
  GA4_PRIVATE_KEY: ${{ secrets.GA4_PRIVATE_KEY }}
  SEARCH_CONSOLE_SITE_URL: ${{ vars.SEARCH_CONSOLE_SITE_URL }}
  META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}

jobs:
  lead-finder:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/leadFinder.mjs
        working-directory: automation

  outreach:
    # No `needs: lead-finder` — outreach runs on its own fast cadence and
    # just drains whatever's currently in status:new, independent of
    # whether lead-finder happened to fire on this same trigger.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/outreach.mjs
        working-directory: automation

  social-content:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/socialContent.mjs
        working-directory: automation

  search-traffic:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/searchTraffic.mjs
        working-directory: automation

  leader:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *')
    needs: [outreach, social-content, search-traffic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/agents/leader.mjs
        working-directory: automation
